<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="System Settings, Privacy and Security, Security section, showing the Open Anyway button">
  <defs>
    <clipPath id="w"><rect width="900" height="430" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#w)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect width="900" height="430" fill="#1E1E1E"/>

    <!-- Sidebar -->
    <rect width="270" height="430" fill="#262626"/>
    <rect x="12" y="14" width="246" height="30" rx="7" fill="#333"/>
    <text x="34" y="34" font-size="12.5" fill="#8A8A8E">Search</text>

    <g font-size="13" fill="#E8E8EA">
      <text x="46" y="82">Sound</text>
      <text x="46" y="118">Focus</text>
      <text x="46" y="154">Screen Time</text>
      <text x="46" y="196">Lock Screen</text>
    </g>

    <!-- Selected row -->
    <rect x="10" y="212" width="250" height="34" rx="8" fill="#B052C0"/>
    <rect x="22" y="221" width="17" height="17" rx="4" fill="#FFFFFF" fill-opacity="0.25"/>
    <text x="49" y="234" font-size="13" font-weight="600" fill="#FFFFFF">Privacy &amp; Security</text>

    <g font-size="13" fill="#E8E8EA">
      <text x="46" y="274">Touch ID &amp; Password</text>
      <text x="46" y="310">Users &amp; Groups</text>
      <text x="46" y="352">Game Center</text>
      <text x="46" y="388">iCloud</text>
    </g>

    <!-- Header -->
    <text x="300" y="36" font-size="15.5" font-weight="600" fill="#FFFFFF">Privacy &amp; Security</text>
    <path d="M288 30l-8-7 8-7" fill="none" stroke="#9A9AA0" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Security section -->
    <text x="300" y="86" font-size="14.5" font-weight="700" fill="#FFFFFF">Security</text>

    <rect x="300" y="100" width="576" height="44" rx="9" fill="#2D2D2F"/>
    <text x="318" y="127" font-size="12.5" fill="#E8E8EA">Allow applications from</text>
    <text x="700" y="127" font-size="12.5" fill="#E8E8EA">App Store &amp; Known Developers</text>

    <!-- The blocked row, highlighted -->
    <rect x="300" y="154" width="576" height="96" rx="9" fill="#2D2D2F"/>
    <rect x="300" y="154" width="576" height="96" rx="9" fill="none"
          stroke="#FFD629" stroke-width="2"/>
    <text x="318" y="186" font-size="12.5" fill="#FFFFFF">“Noctura 1.7.dmg” was blocked to protect your Mac.</text>

    <rect x="700" y="168" width="160" height="30" rx="7" fill="#4A4A4E"/>
    <rect x="700" y="168" width="160" height="30" rx="7" fill="none" stroke="#FFD629" stroke-width="1.6"/>
    <text x="780" y="188" font-size="12.5" font-weight="600" text-anchor="middle" fill="#FFFFFF">Open Anyway</text>

    <text x="318" y="216" font-size="11.5" fill="#9A9AA0">Apple could not verify “Noctura 1.7.dmg” is free of malware that may</text>
    <text x="318" y="234" font-size="11.5" fill="#9A9AA0">harm your Mac or compromise your privacy.</text>

    <!-- Below -->
    <rect x="300" y="262" width="576" height="40" rx="9" fill="#2D2D2F"/>
    <text x="330" y="287" font-size="12.5" fill="#E8E8EA">FileVault</text>
    <text x="846" y="287" font-size="12.5" text-anchor="end" fill="#9A9AA0">On</text>

    <rect x="300" y="312" width="576" height="40" rx="9" fill="#2D2D2F"/>
    <text x="330" y="337" font-size="12.5" fill="#E8E8EA">Lockdown Mode</text>
    <text x="846" y="337" font-size="12.5" text-anchor="end" fill="#9A9AA0">Off</text>
  </g>
  <rect width="900" height="430" rx="10" fill="none" stroke="#3A3A3C"/>
</svg>
