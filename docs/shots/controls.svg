<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" role="img" aria-label="Noctura's control sheet: timer, aspect, styles, night mode and format, each showing its current setting">
  <defs>
    <linearGradient id="scene2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B3550"/><stop offset="45%" stop-color="#3D4A63"/>
      <stop offset="100%" stop-color="#1B2130"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.07"/>
    </linearGradient>
    <clipPath id="win2"><rect width="820" height="620" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#win2)">
    <rect width="820" height="620" fill="#0B0B0D"/>
    <rect x="70" y="70" width="680" height="383" rx="8" fill="url(#scene2)"/>
    <rect x="70" y="70" width="680" height="383" rx="8" fill="#000" fill-opacity="0.35"/>

    <!-- Control sheet -->
    <rect x="96" y="176" width="628" height="262" rx="22" fill="url(#glass2)"/>
    <rect x="96" y="176" width="628" height="262" rx="22" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.12"/>

    <g font-family="-apple-system,BlinkMacSystemFont,sans-serif" text-anchor="middle">
      <!-- Row 1 -->
      <g transform="translate(200 228)">
        <circle r="21" fill="#FFFFFF" fill-opacity="0.07"/>
        <path d="M-6-6 6 6M6-6-6 6" stroke="#6E6E78" stroke-width="1.8"/>
        <text y="36" font-size="8.5" font-weight="600" fill="#55555E" letter-spacing="0.5">FLASH</text>
      </g>
      <g transform="translate(410 228)">
        <circle r="21" fill="#FFFFFF" fill-opacity="0.07"/>
        <text y="5" font-size="17" font-style="italic" fill="#6E6E78">f</text>
        <text y="36" font-size="8.5" font-weight="600" fill="#55555E" letter-spacing="0.5">DEPTH</text>
      </g>
      <g transform="translate(620 228)">
        <circle r="21" fill="#FFD629" fill-opacity="0.18"/>
        <circle r="8" fill="none" stroke="#FFD629" stroke-width="1.6"/>
        <circle r="3" fill="#FFD629"/>
        <text y="36" font-size="8.5" font-weight="600" fill="#8A8A94" letter-spacing="0.5">LIVE</text>
        <text y="47" font-size="8.5" font-weight="700" fill="#FFD629">ON</text>
      </g>
      <!-- Row 2 -->
      <g transform="translate(200 318)">
        <circle r="21" fill="#FFD629" fill-opacity="0.18"/>
        <circle r="9" fill="none" stroke="#FFD629" stroke-width="1.6"/>
        <path d="M0-5V0l3 3" stroke="#FFD629" stroke-width="1.6" fill="none"/>
        <text y="36" font-size="8.5" font-weight="600" fill="#8A8A94" letter-spacing="0.5">TIMER</text>
        <text y="47" font-size="8.5" font-weight="700" fill="#FFD629">3s</text>
      </g>
      <g transform="translate(410 318)">
        <circle r="21" fill="#FFFFFF" fill-opacity="0.09"/>
        <path d="M0-7V7M-7 0H7" stroke="#E9E9EE" stroke-width="1.6"/>
        <circle r="9" fill="none" stroke="#E9E9EE" stroke-width="1.4"/>
        <text y="36" font-size="8.5" font-weight="600" fill="#8A8A94" letter-spacing="0.5">EXPOSURE</text>
      </g>
      <g transform="translate(620 318)">
        <circle r="21" fill="#FFD629" fill-opacity="0.18"/>
        <circle r="9" fill="none" stroke="#FFD629" stroke-width="1.5" stroke-dasharray="2.4 2.4"/>
        <text y="36" font-size="8.5" font-weight="600" fill="#8A8A94" letter-spacing="0.5">STYLES</text>
        <text y="47" font-size="8.5" font-weight="700" fill="#FFD629">Vibrant</text>
      </g>
      <!-- Row 3 -->
      <g transform="translate(200 404)">
        <circle r="21" fill="#FFD629" fill-opacity="0.18"/>
        <rect x="-8" y="-6" width="16" height="12" rx="2" fill="none" stroke="#FFD629" stroke-width="1.5"/>
        <text y="36" font-size="8.5" font-weight="600" fill="#8A8A94" letter-spacing="0.5">ASPECT</text>
        <text y="47" font-size="8.5" font-weight="700" fill="#FFD629">16:9</text>
      </g>
      <g transform="translate(410 404)">
        <circle r="21" fill="#FFD629" fill-opacity="0.18"/>
        <path d="M4-7a8 8 0 1 0 5 12A9 9 0 0 1 4-7z" fill="#FFD629"/>
        <text y="36" font-size="8.5" font-weight="600" fill="#8A8A94" letter-spacing="0.5">NIGHT MODE</text>
        <text y="47" font-size="8.5" font-weight="700" fill="#FFD629">LOW</text>
      </g>
      <g transform="translate(620 404)">
        <circle r="21" fill="#FFD629" fill-opacity="0.22"/>
        <rect x="-7" y="-8" width="14" height="16" rx="2" fill="none" stroke="#FFD629" stroke-width="1.5"/>
        <text y="36" font-size="8.5" font-weight="600" fill="#8A8A94" letter-spacing="0.5">FORMAT</text>
        <text y="47" font-size="8.5" font-weight="700" fill="#FFD629">HEIF</text>
      </g>
    </g>

    <circle cx="410" cy="586" r="27" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="410" cy="586" r="21" fill="#FFFFFF"/>
  </g>
  <rect width="820" height="620" rx="12" fill="none" stroke="#26262C"/>
</svg>
