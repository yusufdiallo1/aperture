<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" role="img" aria-label="Noctura's library: a featured capture above a four-column grid">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34405C"/><stop offset="100%" stop-color="#1D2433"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A3B52"/><stop offset="100%" stop-color="#261E2C"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F4A44"/><stop offset="100%" stop-color="#18272400"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#524334"/><stop offset="100%" stop-color="#2A221A"/>
    </linearGradient>
    <linearGradient id="glass3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="win3"><rect width="820" height="620" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#win3)">
    <rect width="820" height="620" fill="#0B0B0D"/>

    <g transform="translate(410 34)">
      <rect x="-146" y="-17" width="292" height="34" rx="17" fill="url(#glass3)"/>
      <rect x="-50" y="-13" width="92" height="26" rx="13" fill="#FFD629" fill-opacity="0.16"/>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system,sans-serif"
            font-size="11.5" font-weight="600" fill="#FFD629">Library</text>
    </g>

    <!-- Featured -->
    <rect x="150" y="72" width="520" height="292" rx="10" fill="url(#g1)"/>
    <g font-family="-apple-system,sans-serif">
      <text x="150" y="392" font-size="13" font-weight="600" fill="#F2F2F5">Sep 23, 2026 at 3:01 PM</text>
      <text x="150" y="409" font-size="11" fill="#8A8A94">Photo · 214 KB</text>
      <circle cx="590" cy="392" r="17" fill="url(#glass3)"/>
      <circle cx="632" cy="392" r="17" fill="url(#glass3)"/>
      <circle cx="674" cy="392" r="17" fill="#FF4D4D" fill-opacity="0.16"/>
    </g>

    <!-- Grid header -->
    <text x="150" y="452" font-family="-apple-system,sans-serif" font-size="10.5"
          font-weight="700" fill="#8A8A94" letter-spacing="1.1">ALL CAPTURES</text>
    <text x="556" y="452" font-family="-apple-system,sans-serif" font-size="10.5"
          fill="#8A8A94">8 · 1.7 MB</text>
    <text x="628" y="452" font-family="-apple-system,sans-serif" font-size="10.5"
          font-weight="600" fill="#FFD629">Select</text>
    <rect x="662" y="440" width="24" height="17" rx="5" fill="#FFD629" fill-opacity="0.2"/>
    <rect x="692" y="440" width="24" height="17" rx="5" fill="#FFFFFF" fill-opacity="0.07"/>

    <!-- Four columns, each cell inside its column -->
    <g>
      <rect x="150" y="468" width="124" height="93" rx="7" fill="url(#g1)" stroke="#FFD629" stroke-width="1.6"/>
      <rect x="286" y="468" width="124" height="93" rx="7" fill="url(#g2)"/>
      <rect x="422" y="468" width="124" height="93" rx="7" fill="url(#g3)"/>
      <rect x="558" y="468" width="124" height="93" rx="7" fill="url(#g4)"/>
      <g font-family="-apple-system,sans-serif" font-size="8.5" font-weight="500" fill="#FFFFFF" fill-opacity="0.9">
        <text x="158" y="554">3:01 PM</text><text x="294" y="554">3:01 PM</text>
        <text x="430" y="554">2:58 PM</text><text x="566" y="554">2:47 PM</text>
      </g>
    </g>
  </g>
  <rect width="820" height="620" rx="12" fill="none" stroke="#26262C"/>
</svg>
