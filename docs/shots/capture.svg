<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" role="img" aria-label="Noctura's capture screen: mode carousel, control sheet and shutter">
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B3550"/>
      <stop offset="45%" stop-color="#3D4A63"/>
      <stop offset="100%" stop-color="#1B2130"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="win"><rect width="820" height="620" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="820" height="620" fill="#0B0B0D"/>

    <!-- Tab bar -->
    <g transform="translate(410 34)">
      <rect x="-146" y="-17" width="292" height="34" rx="17" fill="url(#glass)"/>
      <rect x="-142" y="-13" width="96" height="26" rx="13" fill="#FFD629" fill-opacity="0.16"/>
      <circle cx="-124" cy="0" r="6" fill="none" stroke="#FFD629" stroke-width="1.6"/>
      <text x="-110" y="4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="11.5" font-weight="600" fill="#FFD629">Camera</text>
      <circle cx="-12" cy="0" r="6" fill="none" stroke="#9A9AA4" stroke-width="1.5"/>
      <rect x="26" y="-6" width="13" height="11" rx="2" fill="none" stroke="#9A9AA4" stroke-width="1.5"/>
      <circle cx="74" cy="0" r="6" fill="none" stroke="#9A9AA4" stroke-width="1.5"/>
      <circle cx="116" cy="-2" r="4" fill="none" stroke="#9A9AA4" stroke-width="1.5"/>
    </g>

    <!-- Viewfinder, held to the capture ratio and centred -->
    <rect x="70" y="70" width="680" height="383" rx="8" fill="url(#scene)"/>
    <text x="86" y="96" font-family="-apple-system,sans-serif" font-size="11"
          font-weight="700" fill="#FFD629" letter-spacing="0.5">HEIF</text>

    <!-- Rule of thirds -->
    <g stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.8">
      <line x1="297" y1="70" x2="297" y2="453"/>
      <line x1="523" y1="70" x2="523" y2="453"/>
      <line x1="70" y1="198" x2="750" y2="198"/>
      <line x1="70" y1="325" x2="750" y2="325"/>
    </g>

    <!-- Zoom pills -->
    <g transform="translate(410 420)">
      <rect x="-104" y="-17" width="208" height="34" rx="17" fill="#000" fill-opacity="0.45"/>
      <circle cx="-78" cy="0" r="15" fill="#FFFFFF" fill-opacity="0.16"/>
      <text x="-78" y="4" text-anchor="middle" font-family="-apple-system,sans-serif"
            font-size="11.5" font-weight="700" fill="#FFD629">1×</text>
      <text x="-39" y="4" text-anchor="middle" font-family="-apple-system,sans-serif"
            font-size="10.5" font-weight="700" fill="#E9E9EE">2</text>
      <text x="0" y="4" text-anchor="middle" font-family="-apple-system,sans-serif"
            font-size="10.5" font-weight="700" fill="#E9E9EE">3</text>
      <text x="39" y="4" text-anchor="middle" font-family="-apple-system,sans-serif"
            font-size="10.5" font-weight="700" fill="#6E6E78">5</text>
      <text x="78" y="4" text-anchor="middle" font-family="-apple-system,sans-serif"
            font-size="10.5" font-weight="700" fill="#6E6E78">7</text>
    </g>

    <!-- Readout -->
    <g transform="translate(410 487)" font-family="-apple-system,sans-serif" text-anchor="middle">
      <rect x="-118" y="-19" width="236" height="38" rx="19" fill="url(#glass)"/>
      <text x="-80" y="-2" font-size="13" font-weight="700" fill="#FFD629">30</text>
      <text x="-80" y="11" font-size="7.5" font-weight="600" fill="#8A8A94">FPS</text>
      <text x="-26" y="-2" font-size="13" font-weight="700" fill="#FFD629">1080p</text>
      <text x="-26" y="11" font-size="7.5" font-weight="600" fill="#8A8A94">RES</text>
      <text x="30" y="-2" font-size="13" font-weight="700" fill="#FFD629">0.0</text>
      <text x="30" y="11" font-size="7.5" font-weight="600" fill="#8A8A94">EV</text>
      <text x="82" y="-2" font-size="13" font-weight="700" fill="#FFD629">HEIF</text>
      <text x="82" y="11" font-size="7.5" font-weight="600" fill="#8A8A94">FMT</text>
    </g>

    <!-- Mode carousel -->
    <g transform="translate(410 533)" font-family="-apple-system,sans-serif"
       font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.6">
      <text x="-238" y="4" fill="#55555E">TIME LAPSE</text>
      <text x="-140" y="4" fill="#7A7A84">SLO-MO</text>
      <rect x="-58" y="-14" width="72" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.11"/>
      <text x="-22" y="4" fill="#FFD629">PHOTO</text>
      <text x="76" y="4" fill="#7A7A84">PORTRAIT</text>
      <text x="184" y="4" fill="#55555E">VIDEO</text>
      <text x="268" y="4" fill="#3E3E46">CINEMATIC</text>
    </g>

    <!-- Shutter + wells -->
    <circle cx="410" cy="586" r="27" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="410" cy="586" r="21" fill="#FFFFFF"/>
    <rect x="58" y="566" width="40" height="40" rx="10" fill="url(#glass)"/>
    <rect x="66" y="574" width="24" height="24" rx="4" fill="#3D4A63"/>
    <circle cx="742" cy="586" r="20" fill="url(#glass)"/>
    <path d="M735 586a7 7 0 0 1 14 0" fill="none" stroke="#E9E9EE" stroke-width="1.6"/>
  </g>
  <rect width="820" height="620" rx="12" fill="none" stroke="#26262C" stroke-width="1"/>
</svg>
